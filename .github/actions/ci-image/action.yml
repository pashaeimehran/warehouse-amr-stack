name: CI image
description: >
  Build docker/Dockerfile.ci with the GitHub Actions layer cache and load it
  into the local Docker daemon as wmm-ci:local. After the first run the build is
  a cache hit, so ROS and the toolchain are never reinstalled per run.
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: docker
        file: docker/Dockerfile.ci
        tags: wmm-ci:local
        load: true
        cache-from: type=gha,scope=wmm-ci
        cache-to: type=gha,scope=wmm-ci,mode=max
