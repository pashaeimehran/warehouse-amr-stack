# ros2_control controllers of the AMR base, loaded by gz_ros2_control.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    # Must match amr_base.urdf.xacro (wheel_separation, wheel_radius).
    wheel_separation: 0.56
    wheel_radius: 0.08

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    # Odometry from wheel encoders only; 2D motion.
    open_loop: false
    position_feedback: true
    pose_covariance_diagonal: [0.001, 0.001, 1.0e6, 1.0e6, 1.0e6, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1.0e6, 1.0e6, 1.0e6, 0.01]

    # A stale command stops the robot (s).
    cmd_vel_timeout: 0.5

    # Limits sized for a warehouse AMR in aisles (m/s, m/s^2, rad/s, rad/s^2).
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -0.5
    linear.x.max_acceleration: 0.8
    linear.x.min_acceleration: -1.5
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0
