# gcovr configuration, shared by tools/ci/check_core.sh (coverage step) and CI.
# Requires gcovr >= 7.0 (Ubuntu 24.04 package: gcovr 7.0-1).
root = .
# Only the ROS-free domain libraries count (sources and headers, never tests).
filter = src/[a-z_]+_core/(include|src)/
exclude = .*/test/.*
# Coverage is measured on the debug build of the coverage preset only. Search
# only there: other build trees (e.g. build/docker-ci from a container run)
# hold .gcda files with container paths that gcov cannot resolve on the host.
search-path = build/coverage
object-directory = build/coverage
exclude-unreachable-branches = yes
exclude-throw-branches = yes
# Roadmap target for v0.1-core: coverage above 85 %.
fail-under-line = 85
print-summary = yes
